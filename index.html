<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aqsiona.com — En construcción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3A4B;
    --navy-deep:#122733;
    --orange:#F2542D;
    --yellow:#FFC93C;
    --cream:#FBF7EE;
    --concrete:#DAD4C6;
    --skin-a:#E8B48C;
    --skin-b:#8C5A3C;
    --skin-c:#F3CBA0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--navy-deep);
    overflow-x:hidden;
  }

  .tape{
    position:relative;
    width:100%;
    background:repeating-linear-gradient(
      -45deg,
      var(--yellow) 0 28px,
      var(--navy-deep) 28px 56px
    );
    padding:10px 0;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  .tape span{
    background:var(--cream);
    padding:4px 22px;
    border-radius:3px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    letter-spacing:0.5px;
    color:var(--navy-deep);
    display:inline-block;
  }

  main{
    max-width:980px;
    margin:0 auto;
    padding:40px 24px 60px;
    text-align:center;
  }

  .headline{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    line-height:1.05;
    margin:28px 0 6px;
    font-size:clamp(2.4rem, 7vw, 4.4rem);
    color:var(--navy-deep);
  }

  .headline .accent{
    color:var(--orange);
  }

  .sub{
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    font-weight:600;
    color:var(--navy);
    max-width:560px;
    margin:0 auto 8px;
  }

  .sub-small{
    font-size:0.95rem;
    color:#5b6b73;
    font-weight:600;
    margin-bottom:34px;
  }

  .site-tag{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--orange);
    letter-spacing:0.5px;
  }

  /* ===== SCENE ===== */
  .scene-wrap{
    position:relative;
    margin:10px auto 30px;
    max-width:900px;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
  }

  /* ===== PROGRESS ===== */
  .progress-block{
    max-width:460px;
    margin:0 auto 6px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    font-size:0.85rem;
    color:var(--navy);
    margin-bottom:6px;
  }
  .progress-track{
    width:100%;
    height:18px;
    border-radius:9px;
    background:var(--concrete);
    border:2px solid var(--navy-deep);
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(
      -45deg,
      var(--orange) 0 10px,
      var(--yellow) 10px 20px
    );
    border-radius:9px 0 0 9px;
    animation:fillbar 3.2s ease-out forwards;
  }
  @keyframes fillbar{
    0%{width:0%;}
    100%{width:67%;}
  }

  footer{
    margin-top:20px;
    font-size:0.85rem;
    color:#8a9399;
    font-weight:600;
  }
  footer a{
    color:var(--orange);
    text-decoration:none;
    font-weight:700;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes hammerSwing{
    0%,100%{transform:rotate(-18deg);}
    50%{transform:rotate(22deg);}
  }
  .hammer-arm{
    transform-origin:70px 210px;
    animation:hammerSwing 0.7s ease-in-out infinite;
  }

  @keyframes brushMove{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    50%{transform:translate(6px,-3px) rotate(-8deg);}
  }
  .brush-arm{
    transform-origin:0 0;
    animation:brushMove 1.4s ease-in-out infinite;
  }

  @keyframes gearSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .gear{
    transform-origin:center;
    animation:gearSpin 6s linear infinite;
  }

  @keyframes carryBob{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-6px);}
  }
  .carry-block{
    animation:carryBob 1.1s ease-in-out infinite;
  }

  @keyframes dustPuff{
    0%{opacity:0; transform:translate(0,0) scale(0.5);}
    40%{opacity:0.6;}
    100%{opacity:0; transform:translate(-14px,-18px) scale(1.3);}
  }
  .dust{
    animation:dustPuff 1.4s ease-out infinite;
  }
  .dust.d2{ animation-delay:0.5s; }
  .dust.d3{ animation-delay:0.9s; }

  @keyframes blink{
    0%,90%,100%{ transform:scaleY(1); }
    95%{ transform:scaleY(0.1); }
  }
  .eye{
    transform-origin:center;
    animation:blink 4s ease-in-out infinite;
  }

  @keyframes bounceLetter{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  .letter{
    display:inline-block;
    animation:bounceLetter 1.6s ease-in-out infinite;
  }

  @keyframes flagWave{
    0%,100%{ transform:skewY(0deg); }
    50%{ transform:skewY(6deg); }
  }
  .flag{
    transform-origin:0 0;
    animation:flagWave 1.8s ease-in-out infinite;
  }

  @media (max-width:600px){
    .headline{ font-size:2.1rem; }
    main{ padding:24px 16px 40px; }
  }
</style>
</head>
<body>

  <div class="tape"><span>SITIO EN CONSTRUCCIÓN — VOLVEMOS PRONTO</span></div>

  <main>
    <div class="site-tag">aqsiona.com</div>
    <h1 class="headline">
      <span class="letter" style="animation-delay:0s">L</span><span class="letter" style="animation-delay:0.08s">O</span><span class="letter" style="animation-delay:0.16s">S</span
      ><span class="letter accent" style="animation-delay:0.24s">P</span><span class="letter accent" style="animation-delay:0.32s">R</span><span class="letter accent" style="animation-delay:0.4s">E</span>
      trabajando
    </h1>
    <p class="sub">Estamos construyendo algo nuevo, entre todos.</p>
    <p class="sub-small">Volvé pronto para ver la página terminada 🧱</p>

    <div class="scene-wrap">
      <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">

        <!-- ground -->
        <rect x="0" y="360" width="900" height="60" fill="var(--concrete)"/>
        <rect x="0" y="356" width="900" height="6" fill="var(--navy-deep)" opacity="0.15"/>

        <!-- background wall under construction -->
        <rect x="60" y="200" width="780" height="160" fill="#EFE9DA" stroke="var(--navy-deep)" stroke-width="3" rx="6"/>
        <line x1="60" y1="240" x2="840" y2="240" stroke="var(--navy-deep)" stroke-width="2" opacity="0.2"/>
        <line x1="60" y1="280" x2="840" y2="280" stroke="var(--navy-deep)" stroke-width="2" opacity="0.2"/>
        <line x1="60" y1="320" x2="840" y2="320" stroke="var(--navy-deep)" stroke-width="2" opacity="0.2"/>

        <!-- big sign board with gear -->
        <g transform="translate(390,90)">
          <rect x="-90" y="-40" width="180" height="80" rx="10" fill="var(--navy)" stroke="var(--navy-deep)" stroke-width="3"/>
          <text x="0" y="10" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="700" font-size="26" fill="var(--yellow)">AQSIONA</text>
          <g class="gear" transform="translate(105,0)">
            <circle r="20" fill="var(--orange)" stroke="var(--navy-deep)" stroke-width="3"/>
            <circle r="7" fill="var(--navy-deep)"/>
            <g stroke="var(--orange)" stroke-width="7" stroke-linecap="round">
              <line x1="0" y1="-26" x2="0" y2="-32"/>
              <line x1="0" y1="26" x2="0" y2="32"/>
              <line x1="-26" y1="0" x2="-32" y2="0"/>
              <line x1="26" y1="0" x2="32" y2="0"/>
              <line x1="18" y1="18" x2="22" y2="22"/>
              <line x1="-18" y1="-18" x2="-22" y2="-22"/>
              <line x1="18" y1="-18" x2="22" y2="-22"/>
              <line x1="-18" y1="18" x2="-22" y2="22"/>
            </g>
          </g>
        </g>

        <!-- scaffold poles -->
        <rect x="120" y="180" width="8" height="180" fill="var(--navy-deep)"/>
        <rect x="770" y="180" width="8" height="180" fill="var(--navy-deep)"/>

        <!-- ===== PAPÁ (izquierda, martillando) ===== -->
        <g transform="translate(120,190)">
          <!-- legs -->
          <rect x="-16" y="90" width="14" height="45" rx="5" fill="var(--navy)"/>
          <rect x="6" y="90" width="14" height="45" rx="5" fill="var(--navy)"/>
          <!-- boots -->
          <rect x="-20" y="130" width="22" height="10" rx="3" fill="var(--navy-deep)"/>
          <rect x="2" y="130" width="22" height="10" rx="3" fill="var(--navy-deep)"/>
          <!-- body / vest -->
          <rect x="-24" y="40" width="52" height="55" rx="14" fill="var(--orange)"/>
          <rect x="-24" y="40" width="52" height="55" rx="14" fill="none" stroke="var(--yellow)" stroke-width="3" stroke-dasharray="2 10"/>
          <!-- head -->
          <circle cx="2" cy="18" r="22" fill="var(--skin-a)"/>
          <!-- mustache -->
          <path d="M -8 26 Q 2 33 12 26" stroke="#5b3b23" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- eyes -->
          <circle class="eye" cx="-6" cy="14" r="2.4" fill="var(--navy-deep)"/>
          <circle class="eye" cx="10" cy="14" r="2.4" fill="var(--navy-deep)"/>
          <!-- hard hat -->
          <path d="M -20 6 Q 2 -18 24 6 Z" fill="var(--yellow)" stroke="var(--navy-deep)" stroke-width="2"/>
          <rect x="-22" y="4" width="48" height="6" rx="3" fill="var(--yellow)" stroke="var(--navy-deep)" stroke-width="2"/>

          <!-- static arm -->
          <rect x="-30" y="48" width="12" height="34" rx="6" fill="var(--skin-a)"/>

          <!-- hammering arm group -->
          <g class="hammer-arm">
            <rect x="16" y="45" width="13" height="32" rx="6" fill="var(--skin-a)"/>
            <g transform="translate(26,72)">
              <rect x="-3" y="0" width="6" height="30" fill="#8a5a34"/>
              <rect x="-14" y="-14" width="26" height="16" rx="3" fill="#6b7a80" stroke="var(--navy-deep)" stroke-width="2"/>
            </g>
          </g>

          <!-- little dust puffs where hammer hits -->
          <circle class="dust" cx="20" cy="128" r="4" fill="var(--concrete)"/>
          <circle class="dust d2" cx="26" cy="130" r="3" fill="var(--concrete)"/>
          <circle class="dust d3" cx="14" cy="126" r="3" fill="var(--concrete)"/>
        </g>

        <!-- ===== MAMÁ (sosteniendo el plano / dirigiendo) ===== -->
        <g transform="translate(250,195)">
          <rect x="-14" y="88" width="13" height="42" rx="5" fill="var(--navy-deep)"/>
          <rect x="4" y="88" width="13" height="42" rx="5" fill="var(--navy-deep)"/>
          <rect x="-18" y="125" width="20" height="9" rx="3" fill="#3a2f28"/>
          <rect x="2" y="125" width="20" height="9" rx="3" fill="#3a2f28"/>
          <!-- dress/vest -->
          <path d="M -22 38 Q 2 30 24 38 L 20 92 Q 2 100 -18 92 Z" fill="var(--navy)"/>
          <rect x="-22" y="38" width="46" height="14" rx="7" fill="var(--yellow)" opacity="0.9"/>
          <!-- head -->
          <circle cx="1" cy="16" r="20" fill="var(--skin-c)"/>
          <!-- ponytail -->
          <path d="M 18 6 Q 34 8 30 26 Q 26 32 18 22 Z" fill="#4a2f1c"/>
          <!-- hair top -->
          <path d="M -19 6 Q 1 -14 21 6 Q 12 -2 1 -2 Q -10 -2 -19 6 Z" fill="#4a2f1c"/>
          <circle class="eye" cx="-6" cy="14" r="2.2" fill="var(--navy-deep)"/>
          <circle class="eye" cx="9" cy="14" r="2.2" fill="var(--navy-deep)"/>
          <path d="M -3 22 Q 2 25 7 22" stroke="var(--navy-deep)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- hard hat -->
          <path d="M -18 4 Q 1 -16 20 4 Z" fill="var(--orange)" stroke="var(--navy-deep)" stroke-width="2"/>

          <!-- arms holding blueprint -->
          <rect x="-30" y="46" width="12" height="26" rx="6" fill="var(--skin-c)" transform="rotate(18 -24 46)"/>
          <rect x="18" y="46" width="12" height="26" rx="6" fill="var(--skin-c)" transform="rotate(-18 24 46)"/>
          <g transform="translate(-4,58)">
            <rect x="-24" y="-16" width="48" height="34" rx="3" fill="var(--cream)" stroke="var(--navy-deep)" stroke-width="2"/>
            <line x1="-18" y1="-8" x2="10" y2="-8" stroke="var(--orange)" stroke-width="2"/>
            <line x1="-18" y1="0" x2="16" y2="0" stroke="var(--navy)" stroke-width="2"/>
            <line x1="-18" y1="8" x2="4" y2="8" stroke="var(--orange)" stroke-width="2"/>
          </g>
        </g>

        <!-- ===== NENA RUBIA 16 (pintando el cartel) ===== -->
        <g transform="translate(430,205)">
          <rect x="-12" y="80" width="11" height="38" rx="5" fill="#2f4858"/>
          <rect x="3" y="80" width="11" height="38" rx="5" fill="#2f4858"/>
          <rect x="-15" y="114" width="17" height="8" rx="3" fill="var(--navy-deep)"/>
          <rect x="1" y="114" width="17" height="8" rx="3" fill="var(--navy-deep)"/>
          <!-- overalls -->
          <rect x="-19" y="36" width="40" height="48" rx="12" fill="var(--yellow)"/>
          <rect x="-19" y="36" width="40" height="48" rx="12" fill="none" stroke="var(--orange)" stroke-width="2" opacity="0.7"/>
          <!-- head -->
          <circle cx="1" cy="16" r="18" fill="var(--skin-c)"/>
          <!-- long blonde hair -->
          <path d="M -17 8 Q 1 -14 19 8 Q 22 34 12 40 Q 16 18 1 12 Q -14 18 -10 40 Q -20 34 -17 8 Z" fill="#f2d16b"/>
          <circle class="eye" cx="-6" cy="14" r="2" fill="var(--navy-deep)"/>
          <circle class="eye" cx="8" cy="14" r="2" fill="var(--navy-deep)"/>
          <path d="M -3 21 Q 1 23 5 21" stroke="var(--navy-deep)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

          <!-- static arm -->
          <rect x="14" y="42" width="10" height="26" rx="5" fill="var(--skin-c)"/>

          <!-- painting arm -->
          <g class="brush-arm" transform="translate(-14,44)">
            <rect x="-3" y="0" width="10" height="24" rx="5" fill="var(--skin-c)" transform="rotate(20)"/>
            <g transform="translate(-8,20) rotate(20)">
              <rect x="-3" y="0" width="6" height="16" fill="#8a5a34"/>
              <rect x="-6" y="-8" width="12" height="10" rx="2" fill="#5b6b73"/>
              <path d="M -6 -8 L -8 -14 L 6 -14 L 4 -8 Z" fill="var(--orange)"/>
            </g>
          </g>

          <!-- small easel sign she's painting -->
          <g transform="translate(-40,20)">
            <rect x="-2" y="0" width="4" height="55" fill="#8a7a63"/>
            <rect x="-30" y="-38" width="56" height="40" rx="4" fill="var(--cream)" stroke="var(--navy-deep)" stroke-width="2"/>
            <text x="-2" y="-14" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="700" font-size="12" fill="var(--orange)">EN</text>
          </g>
        </g>

        <!-- ===== NENA MOROCHA 14 (clavando tablas) ===== -->
        <g transform="translate(590,210)">
          <rect x="-12" y="76" width="11" height="36" rx="5" fill="#3a3a3a"/>
          <rect x="3" y="76" width="11" height="36" rx="5" fill="#3a3a3a"/>
          <rect x="-15" y="108" width="17" height="8" rx="3" fill="var(--navy-deep)"/>
          <rect x="1" y="108" width="17" height="8" rx="3" fill="var(--navy-deep)"/>
          <!-- t-shirt + vest -->
          <rect x="-18" y="34" width="38" height="46" rx="12" fill="#5b8a72"/>
          <rect x="-18" y="34" width="38" height="46" rx="12" fill="none" stroke="var(--yellow)" stroke-width="2" stroke-dasharray="2 8"/>
          <!-- head -->
          <circle cx="1" cy="14" r="17" fill="var(--skin-a)"/>
          <!-- dark pigtail hair -->
          <path d="M -16 6 Q 1 -14 18 6 Q 15 0 1 -2 Q -13 0 -16 6 Z" fill="#241a14"/>
          <circle cx="-16" cy="12" r="6" fill="#241a14"/>
          <circle cx="18" cy="12" r="6" fill="#241a14"/>
          <circle class="eye" cx="-5" cy="12" r="2" fill="#1c1c1c"/>
          <circle class="eye" cx="7" cy="12" r="2" fill="#1c1c1c"/>

          <!-- static arm -->
          <rect x="12" y="40" width="9" height="24" rx="4" fill="var(--skin-a)"/>

          <!-- hammer arm -->
          <g class="hammer-arm" style="transform-origin:-12px 42px; animation-delay:0.2s;">
            <rect x="-21" y="40" width="9" height="24" rx="4" fill="var(--skin-a)"/>
            <g transform="translate(-14,62)">
              <rect x="-2.5" y="0" width="5" height="22" fill="#8a5a34"/>
              <rect x="-11" y="-10" width="20" height="12" rx="2" fill="#6b7a80" stroke="var(--navy-deep)" stroke-width="1.6"/>
            </g>
          </g>

          <!-- wooden plank she's working on -->
          <rect x="-6" y="82" width="60" height="10" rx="2" fill="#c99b62" stroke="var(--navy-deep)" stroke-width="1.6"/>
        </g>

        <!-- ===== NENE 12 (cargando bloques) ===== -->
        <g transform="translate(710,215)">
          <rect x="-11" y="66" width="10" height="34" rx="5" fill="#3f6f8f"/>
          <rect x="2" y="66" width="10" height="34" rx="5" fill="#3f6f8f"/>
          <rect x="-14" y="98" width="16" height="7" rx="3" fill="var(--navy-deep)"/>
          <rect x="0" y="98" width="16" height="7" rx="3" fill="var(--navy-deep)"/>
          <!-- shirt -->
          <rect x="-16" y="30" width="35" height="42" rx="11" fill="var(--orange)"/>
          <!-- head -->
          <circle cx="1" cy="12" r="16" fill="var(--skin-a)"/>
          <!-- hair + cap -->
          <path d="M -14 8 Q 1 -6 16 8" stroke="none" fill="#4a3322"/>
          <path d="M -16 4 Q 1 -14 18 4 L 18 8 Q 1 -2 -16 8 Z" fill="var(--navy)"/>
          <rect x="10" y="2" width="14" height="6" rx="3" fill="var(--navy)"/>
          <circle class="eye" cx="-5" cy="12" r="1.8" fill="var(--navy-deep)"/>
          <circle class="eye" cx="7" cy="12" r="1.8" fill="var(--navy-deep)"/>
          <path d="M -2 18 Q 1 20 4 18" stroke="var(--navy-deep)" stroke-width="1.4" fill="none" stroke-linecap="round"/>

          <!-- arms holding block -->
          <rect x="-24" y="38" width="9" height="20" rx="4" fill="var(--skin-a)" transform="rotate(12 -20 38)"/>
          <rect x="16" y="38" width="9" height="20" rx="4" fill="var(--skin-a)" transform="rotate(-12 20 38)"/>

          <g class="carry-block" transform="translate(-2,32)">
            <rect x="-16" y="-14" width="32" height="26" rx="3" fill="#d9a566" stroke="var(--navy-deep)" stroke-width="2"/>
            <line x1="-16" y1="-1" x2="16" y2="-1" stroke="var(--navy-deep)" stroke-width="1.4" opacity="0.4"/>
          </g>
        </g>

        <!-- small warning flag on left pole -->
        <g transform="translate(128,150)">
          <rect x="0" y="0" width="4" height="40" fill="var(--navy-deep)"/>
          <path class="flag" d="M 4 0 L 34 6 L 4 12 Z" fill="var(--orange)"/>
        </g>
        <g transform="translate(772,150)">
          <rect x="-4" y="0" width="4" height="40" fill="var(--navy-deep)"/>
          <path class="flag" d="M -4 0 L -34 6 L -4 12 Z" fill="var(--yellow)"/>
        </g>

      </svg>
    </div>

    <div class="progress-block">
      <div class="progress-label">
        <span>Avance de la obra</span>
        <span>67%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

  </main>

</body>
</html>
